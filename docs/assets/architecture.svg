<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
  <title id="title">Arquitetura do ePass</title>
  <desc id="desc">Diagrama em camadas: clientes web e mobile, API FastAPI, módulos de domínio, PostgreSQL, armazenamento e integrações, com o módulo Atena de IA local isolado do banco.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B12"/>
      <stop offset="0.55" stop-color="#0E0E16"/>
      <stop offset="1" stop-color="#12101A"/>
    </linearGradient>
    <radialGradient id="glowPink" cx="0.08" cy="0.12" r="0.55">
      <stop offset="0" stop-color="#FF5B8F" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF5B8F" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="0.92" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="apiBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5B8F"/>
      <stop offset="0.55" stop-color="#FF8664"/>
      <stop offset="1" stop-color="#FEE971"/>
    </linearGradient>
    <linearGradient id="atenaBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FF5B8F"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#6C63FF" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF8EAC" fill-opacity="0.7"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA" fill-opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <rect width="1600" height="920" fill="url(#glowPink)"/>
  <rect width="1600" height="920" fill="url(#glowPurple)"/>
  <rect width="1600" height="920" fill="url(#grid)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="62" fill="#FF8EAC" font-size="11" font-weight="800" letter-spacing="3.2">ARQUITETURA DA PLATAFORMA</text>
    <text x="70" y="96" fill="#FFFFFF" font-size="27" font-weight="750" letter-spacing="-0.7">Camadas claras. Limites explícitos.</text>
    <text x="1530" y="62" fill="#FFFFFF" fill-opacity="0.34" font-size="10" font-weight="700" letter-spacing="2" text-anchor="end">WEB + MOBILE → API → DOMÍNIO → DADOS</text>

    <!-- clientes -->
    <g filter="url(#softShadow)">
      <rect x="70" y="132" width="356" height="116" rx="16" fill="#14141D" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <rect x="70" y="132" width="4" height="116" rx="2" fill="#FF5B8F"/>
      <g stroke="#FF8EAC" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="100" y="163" width="28" height="19" rx="2.5"/>
        <path d="M106 190h16M114 182v8"/>
      </g>
      <text x="146" y="176" fill="#FFFFFF" font-size="19" font-weight="700">Web</text>
      <text x="146" y="199" fill="#FFFFFF" fill-opacity="0.5" font-size="12">React 18 · Vite · Tailwind · React Query</text>
      <text x="146" y="219" fill="#FFB3C8" font-size="10" font-weight="700" letter-spacing="1">ADMIN · SECRETARIA</text>
      <text x="146" y="234" fill="#FFB3C8" font-size="10" font-weight="700" letter-spacing="1">COORDENAÇÃO · PROFESSOR</text>
    </g>

    <g filter="url(#softShadow)">
      <rect x="460" y="132" width="356" height="116" rx="16" fill="#14141D" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <rect x="460" y="132" width="4" height="116" rx="2" fill="#FF8664"/>
      <g stroke="#FFB08E" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="491" y="158" width="18" height="29" rx="4"/>
        <path d="M497 183h6"/>
      </g>
      <text x="532" y="176" fill="#FFFFFF" font-size="19" font-weight="700">Mobile</text>
      <text x="532" y="199" fill="#FFFFFF" fill-opacity="0.5" font-size="12">Expo 57 · React Native 0.86 · TypeScript</text>
      <text x="532" y="222" fill="#FFD0BE" font-size="10.5" font-weight="700" letter-spacing="1.2">RESPONSÁVEL · PROFESSOR</text>
    </g>

    <!-- conectores cliente -> api -->
    <path d="M248 248 V318" stroke="#FF8EAC" stroke-opacity="0.5" stroke-width="1.3" marker-end="url(#arrow)"/>
    <path d="M638 248 V318" stroke="#FF8EAC" stroke-opacity="0.5" stroke-width="1.3" marker-end="url(#arrow)"/>

    <!-- api -->
    <g filter="url(#softShadow)">
      <rect x="70" y="320" width="1098" height="120" rx="18" fill="#15151F" stroke="url(#apiBorder)" stroke-width="1.2"/>
      <rect x="96" y="346" width="42" height="42" rx="12" fill="#FF5B8F" fill-opacity="0.12" stroke="#FF5B8F" stroke-opacity="0.3"/>
      <g stroke="#FF8EAC" stroke-width="1.8" fill="none" stroke-linecap="round">
        <path d="M117 357 L108 368 L117 379"/>
        <path d="M117 367 L126 367"/>
      </g>
      <text x="158" y="365" fill="#FFFFFF" font-size="22" font-weight="700">API · FastAPI</text>
      <text x="158" y="389" fill="#FFFFFF" fill-opacity="0.5" font-size="12.5">REST + SSE · Pydantic · 28 módulos de domínio · testes de integração</text>
      <g font-size="10.5" font-weight="700" letter-spacing="0.8">
        <rect x="430" y="346" width="126" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <text x="493" y="363" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">JWT + Argon2id</text>
        <rect x="568" y="346" width="102" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <text x="619" y="363" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">RBAC por perfil</text>
        <rect x="682" y="346" width="142" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <text x="753" y="363" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">rate limit por usuário</text>
        <rect x="836" y="346" width="112" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1"/>
        <text x="892" y="363" fill="#FFFFFF" fill-opacity="0.6" text-anchor="middle">idempotência</text>
        <rect x="960" y="346" width="176" height="26" rx="13" fill="#3DD68C" fill-opacity="0.07" stroke="#3DD68C" stroke-opacity="0.24"/>
        <text x="1048" y="363" fill="#8CF0BE" text-anchor="middle">health + degradação graciosa</text>
      </g>
      <text x="158" y="416" fill="#FFFFFF" fill-opacity="0.34" font-size="11">Autenticação, autorização e validação de entrada ficam no controller — a regra de negócio vive no service.</text>
    </g>

    <!-- api -> dominio -->
    <path d="M619 440 V472" stroke="#FF8EAC" stroke-opacity="0.45" stroke-width="1.3"/>
    <path d="M172 472 H1066" stroke="#FF8EAC" stroke-opacity="0.28" stroke-width="1.2"/>
    <g stroke="#FF8EAC" stroke-opacity="0.45" stroke-width="1.3" marker-end="url(#arrow)">
      <path d="M172 472 V498"/>
      <path d="M396 472 V498"/>
      <path d="M620 472 V498"/>
      <path d="M844 472 V498"/>
      <path d="M1066 472 V498"/>
    </g>
    <text x="70" y="466" fill="#FFFFFF" fill-opacity="0.28" font-size="9.5" font-weight="700" letter-spacing="1.6">DOMÍNIO</text>

    <!-- modulos -->
    <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif">
      <g filter="url(#softShadow)">
        <rect x="70" y="500" width="205" height="142" rx="14" fill="#14141D" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <rect x="70" y="500" width="205" height="3" rx="1.5" fill="#FF5B8F"/>
        <text x="90" y="530" fill="#FFFFFF" font-size="16.5" font-weight="700">Acadêmico</text>
        <text x="90" y="554" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">anos letivos · séries · turmas</text>
        <text x="90" y="574" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">matrículas · alocações · grade</text>
        <text x="90" y="594" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">boletins · histórico escolar</text>
        <circle cx="92" cy="618" r="3" fill="#FF5B8F"/>
        <text x="103" y="622" fill="#FFB3C8" font-size="10" font-weight="700">CORE ACADÊMICO</text>
      </g>
      <g filter="url(#softShadow)">
        <rect x="292" y="500" width="205" height="142" rx="14" fill="#14141D" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <rect x="292" y="500" width="205" height="3" rx="1.5" fill="#FF8664"/>
        <text x="312" y="530" fill="#FFFFFF" font-size="16.5" font-weight="700">Diário</text>
        <text x="312" y="554" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">chamadas · frequência</text>
        <text x="312" y="574" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">avaliações · notas</text>
        <text x="312" y="594" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">recuperação · situação final</text>
        <circle cx="314" cy="618" r="3" fill="#FF8664"/>
        <text x="325" y="622" fill="#FFD0BE" font-size="10" font-weight="700">PROFESSOR + COORDENAÇÃO</text>
      </g>
      <g filter="url(#softShadow)">
        <rect x="514" y="500" width="205" height="142" rx="14" fill="#14141D" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <rect x="514" y="500" width="205" height="3" rx="1.5" fill="#FEE971"/>
        <text x="534" y="530" fill="#FFFFFF" font-size="16.5" font-weight="700">Cantina &amp; Carteira</text>
        <text x="534" y="554" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">menu · pedidos · produção</text>
        <text x="534" y="574" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">saldo · recarga · extrato</text>
        <text x="534" y="594" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">estoque · RFID · autonomia</text>
        <circle cx="536" cy="618" r="3" fill="#FEE971"/>
        <text x="547" y="622" fill="#FFF3A8" font-size="10" font-weight="700">OPERAÇÃO + FINANCEIRO</text>
      </g>
      <g filter="url(#softShadow)">
        <rect x="736" y="500" width="205" height="142" rx="14" fill="#14141D" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <rect x="736" y="500" width="205" height="3" rx="1.5" fill="#6BA6FF"/>
        <text x="756" y="530" fill="#FFFFFF" font-size="16.5" font-weight="700">Comunicação</text>
        <text x="756" y="554" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">avisos · respostas · leitura</text>
        <text x="756" y="574" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">ocorrências · escalonamento</text>
        <text x="756" y="594" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">SSE · push · e-mail opt-in</text>
        <circle cx="758" cy="618" r="3" fill="#6BA6FF"/>
        <text x="769" y="622" fill="#B9D3FF" font-size="10" font-weight="700">MULTICANAL IDEMPOTENTE</text>
      </g>
      <g filter="url(#softShadow)">
        <rect x="958" y="500" width="205" height="142" rx="14" fill="#14141D" stroke="#FFFFFF" stroke-opacity="0.08"/>
        <rect x="958" y="500" width="205" height="3" rx="1.5" fill="#3DD68C"/>
        <text x="978" y="530" fill="#FFFFFF" font-size="16.5" font-weight="700">Documentos</text>
        <text x="978" y="554" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">solicitações · respostas</text>
        <text x="978" y="574" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">agenda · eventos</text>
        <text x="978" y="594" fill="#FFFFFF" fill-opacity="0.48" font-size="11.5">relatórios · PDFs</text>
        <circle cx="980" cy="618" r="3" fill="#3DD68C"/>
        <text x="991" y="622" fill="#8CF0BE" font-size="10" font-weight="700">ANTI-IDOR · ESCOPO POR VÍNCULO</text>
      </g>
    </g>

    <!-- atena sidecar -->
    <g filter="url(#purpleGlow)">
      <rect x="1200" y="320" width="330" height="322" rx="18" fill="#17141F" stroke="url(#atenaBorder)" stroke-width="1.2" stroke-dasharray="5 4"/>
      <rect x="1222" y="344" width="34" height="34" rx="10" fill="#6C63FF" fill-opacity="0.16"/>
      <path d="M1239 351 L1242 358 L1249 361 L1242 364 L1239 371 L1236 364 L1229 361 L1236 358 Z" fill="#C4B5FD"/>
      <text x="1268" y="356" fill="#C4B5FD" font-size="10" font-weight="800" letter-spacing="1.8">MÓDULO DESACOPLADO</text>
      <text x="1268" y="383" fill="#FFFFFF" font-size="25" font-weight="750">Atena</text>
      <text x="1268" y="404" fill="#FFFFFF" fill-opacity="0.5" font-size="12">IA local via Ollama · qwen3:4b</text>
      <g font-size="12" fill="#FFFFFF" fill-opacity="0.66">
        <circle cx="1232" cy="438" r="2.6" fill="#A78BFA"/>
        <text x="1244" y="442">allowlist de 46 intenções por perfil</text>
        <circle cx="1232" cy="466" r="2.6" fill="#A78BFA"/>
        <text x="1244" y="470">escopo resolvido antes da consulta</text>
        <circle cx="1232" cy="494" r="2.6" fill="#A78BFA"/>
        <text x="1244" y="498">contexto autorizado + guardrails</text>
        <circle cx="1232" cy="522" r="2.6" fill="#A78BFA"/>
        <text x="1244" y="526">rede interna, sem acesso ao banco</text>
      </g>
      <rect x="1222" y="550" width="286" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
      <rect x="1222" y="568" width="286" height="48" rx="10" fill="#3DD68C" fill-opacity="0.06" stroke="#3DD68C" stroke-opacity="0.18"/>
      <text x="1240" y="588" fill="#8CF0BE" font-size="10.5" font-weight="800" letter-spacing="0.6">O SGE NÃO DEPENDE DA IA.</text>
      <text x="1240" y="605" fill="#FFFFFF" fill-opacity="0.45" font-size="10.5">Ollama fora do ar → /health segue 200.</text>
    </g>
    <path d="M1168 380 H1198" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="1.3" stroke-dasharray="4 4" marker-end="url(#arrowPurple)"/>

    <!-- dominio -> dados -->
    <path d="M619 642 V678" stroke="#6BA6FF" stroke-opacity="0.35" stroke-width="1.2"/>
    <path d="M172 678 H1066" stroke="#6BA6FF" stroke-opacity="0.22" stroke-width="1.2"/>
    <g stroke="#6BA6FF" stroke-opacity="0.38" stroke-width="1.2" marker-end="url(#arrow)">
      <path d="M172 678 V698"/>
      <path d="M396 678 V698"/>
      <path d="M620 678 V698"/>
      <path d="M844 678 V698"/>
      <path d="M1066 678 V698"/>
    </g>
    <text x="70" y="696" fill="#FFFFFF" fill-opacity="0.28" font-size="9.5" font-weight="700" letter-spacing="1.6">PERSISTÊNCIA &amp; INTEGRAÇÕES</text>

    <!-- dados -->
    <g filter="url(#softShadow)">
      <rect x="70" y="716" width="338" height="112" rx="14" fill="#14141D" stroke="#6BA6FF" stroke-opacity="0.22"/>
      <g stroke="#6BA6FF" stroke-width="1.7" fill="none">
        <ellipse cx="98" cy="743" rx="12" ry="4.5"/>
        <path d="M86 743 V765 C86 768.5 91.4 771.5 98 771.5 C104.6 771.5 110 768.5 110 765 V743"/>
        <path d="M86 754 C86 757.5 91.4 760.5 98 760.5 C104.6 760.5 110 757.5 110 754"/>
      </g>
      <text x="126" y="746" fill="#FFFFFF" font-size="16" font-weight="700">PostgreSQL 16</text>
      <text x="126" y="768" fill="#FFFFFF" fill-opacity="0.47" font-size="11.5">SQLAlchemy async · Alembic · 40 migrations</text>
      <text x="126" y="790" fill="#B9D3FF" font-size="10" font-weight="700" letter-spacing="1.2">CHECK constraints · locks · idempotência</text>
      <text x="126" y="810" fill="#FFFFFF" fill-opacity="0.35" font-size="10.5">dados transacionais da escola</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="424" y="716" width="228" height="112" rx="14" fill="#14141D" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" fill="none">
        <path d="M450 738 L466 731 L482 738 L482 757 L466 764 L450 757 Z"/>
        <path d="M450 738 L466 745 L482 738 M466 745 V764"/>
      </g>
      <text x="496" y="746" fill="#FFFFFF" font-size="16" font-weight="700">Storage</text>
      <text x="496" y="768" fill="#FFFFFF" fill-opacity="0.47" font-size="11.5">local ou S3</text>
      <text x="496" y="790" fill="#FFFFFF" fill-opacity="0.35" font-size="10.5">documentos, PDFs e imagens</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="668" y="716" width="246" height="112" rx="14" fill="#14141D" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M692 752 C692 741 701 733 712 733 C723 733 732 741 732 752"/>
        <rect x="695" y="752" width="34" height="12" rx="3"/>
        <path d="M700 752 V748 M724 752 V748"/>
      </g>
      <text x="748" y="746" fill="#FFFFFF" font-size="16" font-weight="700">Canais</text>
      <text x="748" y="768" fill="#FFFFFF" fill-opacity="0.47" font-size="11.5">SMTP · Expo Push · SSE</text>
      <text x="748" y="790" fill="#FFFFFF" fill-opacity="0.35" font-size="10.5">e-mail opt-in, receipts e retry</text>
    </g>
    <g filter="url(#softShadow)">
      <rect x="930" y="716" width="238" height="112" rx="14" fill="#14141D" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <g stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.6" fill="none" stroke-linecap="round">
        <path d="M956 756 L962 748 L968 752 L976 741 L984 747"/>
        <path d="M956 756 H984 V762 H956 Z"/>
      </g>
      <text x="998" y="746" fill="#FFFFFF" font-size="16" font-weight="700">Observabilidade</text>
      <text x="998" y="768" fill="#FFFFFF" fill-opacity="0.47" font-size="11.5">Sentry · structlog</text>
      <text x="998" y="790" fill="#FFFFFF" fill-opacity="0.35" font-size="10.5">logs estruturados e health check</text>
    </g>

    <text x="70" y="868" fill="#FFFFFF" fill-opacity="0.34" font-size="11.5">A IA não consulta o banco: o Ollama recebe apenas o contexto já autorizado e formatado pelo backend. Sem DSN, sem credenciais, sem escrita.</text>
    <text x="70" y="890" fill="#FFFFFF" fill-opacity="0.22" font-size="10.5">PostgreSQL 16 · FastAPI · SQLAlchemy async · Alembic · React · Expo · Ollama — tudo orquestrado por Docker Compose.</text>
  </g>
</svg>
