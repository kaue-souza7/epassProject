services:

  postgres:
    image: postgres:16-alpine
    container_name: epass-postgres
    environment:
      POSTGRES_USER: epass
      POSTGRES_PASSWORD: epass123
      POSTGRES_DB: epass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epass"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: epass-backend
    ports:
      - "8000:8000"
    environment:
      ENV: local
      DATABASE_URL: postgresql+asyncpg://epass:epass123@postgres:5432/epass
      DATABASE_URL_SYNC: postgresql://epass:epass123@postgres:5432/epass
      JWT_SECRET: local-docker-jwt-secret
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8081","http://192.168.15.5:8081","exp://192.168.15.5:8081"]'
    volumes:
      - ./backend:/app
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: epass-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
      VITE_ENV: local
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_started

  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    container_name: epass-postgres-test
    environment:
      POSTGRES_USER: epass
      POSTGRES_PASSWORD: epass123
      POSTGRES_DB: epass_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epass"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_storage:
